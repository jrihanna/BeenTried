# Optional: a real Postgres with pgvector for production-like local dev.
# Start it with `docker compose up -d`, then set
# DATABASE_URL=postgres://tarpit:tarpit@localhost:5432/tarpit in .env
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tarpit
      POSTGRES_PASSWORD: tarpit
      POSTGRES_DB: tarpit
    ports:
      - "5432:5432"
    volumes:
      - tarpit-db:/var/lib/postgresql/data

volumes:
  tarpit-db:
